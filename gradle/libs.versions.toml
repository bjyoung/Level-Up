[versions]
appcompat = "1.7.0"
constraintlayout = "2.2.1"
coreKtx = "1.16.0"
foundationAndroid = "1.8.0"
fragmentKtx = "1.8.6"
hilt = "2.43.2"
kotlinGradlePlugin = "1.8.0"
lifecycle = "2.8.7"
material = "1.12.0"
